# Default configuration values
# Override via .env or environment variables

trading:
  mode: paper
  real_trading_enabled: false

risk:
  max_daily_loss_pct: 2.0
  max_weekly_loss_pct: 5.0
  max_consecutive_losses: 3
  max_trades_per_day: 15
  max_trades_per_hour: 6
  max_position_pct: 0.5
  max_open_positions: 3
  cooldown_after_loss_sec: 300
  cooldown_after_trade_sec: 60

backtest:
  min_sample_size: 100
  min_payout: 0.80
  safety_margin: 0.03

strategies:
  min_confidence: 0.65
  min_zone_strength: 0.40
  trend_continuation:
    adx_threshold: 25
    ema_period: 20
  mean_reversion:
    zone_distance_atr: 0.5
    min_wick_ratio: 1.5
  breakout_retest:
    min_body_pct: 0.6
